<div class="container-fluid px-0 animate-fade-in" style="max-width:800px;">
  <div class="page-header">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <h2>{{ titulo }}</h2>
        <p>Administre {{ etiqueta }}s del catálogo del sistema</p>
      </div>
      <a routerLink="/catalogos" class="btn btn-outline-secondary btn-sm">
        <i class="pi pi-arrow-left" style="font-size:0.7rem;"></i> Volver
      </a>
    </div>
  </div>

  <form autocomplete="off" (ngSubmit)="guardar()" #catalogoForm="ngForm">

    <div class="form-section">
      <div class="form-section-header">
        <i class="pi pi-tag" style="color:var(--primary);"></i>
        <div>
          <strong>Datos del {{ etiqueta }}</strong>
          <small>Código, nombre y descripción</small>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Código <span class="text-danger">*</span></label>
          <input autocomplete="off" #codModel="ngModel" [(ngModel)]="form.codigo" name="codigo" required class="form-control" [class.is-invalid]="codModel.invalid && codModel.touched" placeholder="Código">
          <div class="validation-feedback" *ngIf="codModel.invalid && codModel.touched">El código es obligatorio</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Nombre <span class="text-danger">*</span></label>
          <input autocomplete="off" #nomModel="ngModel" [(ngModel)]="form.nombre" name="nombre" required class="form-control" [class.is-invalid]="nomModel.invalid && nomModel.touched" placeholder="Nombre">
          <div class="validation-feedback" *ngIf="nomModel.invalid && nomModel.touched">El nombre es obligatorio</div>
        </div>
        <div class="col-md-6" *ngIf="tipo === 'subcategoria'">
          <label class="form-label">Categoría <span class="text-danger">*</span></label>
          <select autocomplete="off" #catModel="ngModel" [(ngModel)]="form.idCategoria" name="idCategoria" required class="form-select" [class.is-invalid]="catModel.invalid && catModel.touched">
            <option [ngValue]="null">— Seleccione —</option>
            <option *ngFor="let c of categorias" [ngValue]="c.idCategoria">{{ c.nombre }}</option>
          </select>
          <div class="validation-feedback" *ngIf="catModel.invalid && catModel.touched">Seleccione una categoría</div>
        </div>
        <div class="col-12">
          <label class="form-label">Descripción</label>
          <textarea autocomplete="off" [(ngModel)]="form.descripcion" name="descripcion" class="form-control" rows="3" placeholder="Descripción (opcional)"></textarea>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
      <a routerLink="/catalogos" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary px-4" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm me-1"></span>
        {{ cargando ? 'Guardando...' : (editando ? 'Actualizar' : 'Guardar') }}
      </button>
    </div>
  </form>
</div>
