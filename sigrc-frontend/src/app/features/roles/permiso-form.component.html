<div class="container-fluid px-0 animate-fade-in" style="max-width:800px;">
  <div class="page-header">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <h2>{{ editando ? 'Editar Permiso' : 'Nuevo Permiso' }}</h2>
        <p>Definición de permisos que se asignan a los roles del sistema</p>
      </div>
      <a routerLink="/roles" class="btn btn-outline-secondary btn-sm">
        <i class="pi pi-arrow-left" style="font-size:0.7rem;"></i> Volver
      </a>
    </div>
  </div>

  <form autocomplete="off" (ngSubmit)="guardar()" #permisoFormElem="ngForm">

    <!-- 1. Datos del permiso -->
    <div class="form-section">
      <div class="form-section-header">
        <i class="pi pi-key" style="color:var(--primary);"></i>
        <div>
          <strong>Datos del Permiso</strong>
          <small>Código, nombre, módulo y tipo de acceso</small>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Código <span class="text-danger">*</span></label>
          <input autocomplete="off" #codModel="ngModel" [(ngModel)]="form.codigo" name="codigo" required class="form-control" [class.is-invalid]="codModel.invalid && codModel.touched" placeholder="TICKET_CREAR">
          <div class="validation-feedback" *ngIf="codModel.invalid && codModel.touched">El código es obligatorio</div>
          <div class="form-text">Ej: <code>TICKET_CREAR</code></div>
        </div>
        <div class="col-md-4">
          <label class="form-label">Nombre <span class="text-danger">*</span></label>
          <input autocomplete="off" #nomModel="ngModel" [(ngModel)]="form.nombre" name="nombre" required class="form-control" [class.is-invalid]="nomModel.invalid && nomModel.touched" placeholder="Crear Ticket">
          <div class="validation-feedback" *ngIf="nomModel.invalid && nomModel.touched">El nombre es obligatorio</div>
        </div>
        <div class="col-md-4">
          <label class="form-label">Módulo <span class="text-danger">*</span></label>
          <input autocomplete="off" #modModel="ngModel" [(ngModel)]="form.modulo" name="modulo" required class="form-control" [class.is-invalid]="modModel.invalid && modModel.touched" placeholder="TICKETS">
          <div class="validation-feedback" *ngIf="modModel.invalid && modModel.touched">El módulo es obligatorio</div>
          <div class="form-text">Ej: <code>TICKETS</code></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Tipo de acceso</label>
          <select autocomplete="off" [(ngModel)]="form.tipoAcceso" name="tipoAcceso" class="form-select">
            <option value="LECTURA">Lectura</option>
            <option value="ESCRITURA">Escritura</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Descripción</label>
          <textarea autocomplete="off" [(ngModel)]="form.descripcion" name="descripcion" class="form-control" style="min-height:80px;resize:vertical;" placeholder="Descripción del permiso (opcional)"></textarea>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
      <a routerLink="/roles" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary px-4" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm me-1"></span>
        {{ cargando ? 'Guardando...' : (editando ? 'Actualizar Permiso' : 'Crear Permiso') }}
      </button>
    </div>
  </form>
</div>
