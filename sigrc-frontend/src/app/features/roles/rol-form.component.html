<div class="container-fluid px-0 animate-fade-in" style="max-width:800px;">
  <div class="page-header">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <h2>{{ editando ? 'Editar Rol' : 'Nuevo Rol' }}</h2>
        <p>Definición de roles del sistema y su alcance de acceso</p>
      </div>
      <a routerLink="/roles" class="btn btn-outline-secondary btn-sm">
        <i class="pi pi-arrow-left" style="font-size:0.7rem;"></i> Volver
      </a>
    </div>
  </div>

  <form autocomplete="off" (ngSubmit)="guardar()" #rolFormElem="ngForm">

    <!-- 1. Datos del rol -->
    <div class="form-section">
      <div class="form-section-header">
        <i class="pi pi-id-card" style="color:var(--primary);"></i>
        <div>
          <strong>Datos del Rol</strong>
          <small>Código, nombre y descripción del rol</small>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Código <span class="text-danger">*</span></label>
          <input autocomplete="off" #codModel="ngModel" [(ngModel)]="form.codigo" name="codigo" required class="form-control" [class.is-invalid]="codModel.invalid && codModel.touched" placeholder="ej: ANALISTA_TI">
          <div class="validation-feedback" *ngIf="codModel.invalid && codModel.touched">El código es obligatorio</div>
          <div class="form-text">Código único en mayúsculas. Ej: <code>ANALISTA_TI</code></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Nombre <span class="text-danger">*</span></label>
          <input autocomplete="off" #nomModel="ngModel" [(ngModel)]="form.nombre" name="nombre" required class="form-control" [class.is-invalid]="nomModel.invalid && nomModel.touched" placeholder="Analista TI">
          <div class="validation-feedback" *ngIf="nomModel.invalid && nomModel.touched">El nombre es obligatorio</div>
        </div>
        <div class="col-12">
          <label class="form-label">Descripción</label>
          <textarea autocomplete="off" [(ngModel)]="form.descripcion" name="descripcion" class="form-control" style="min-height:80px;resize:vertical;" placeholder="Responsabilidades y alcance del rol..."></textarea>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
      <a routerLink="/roles" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary px-4" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm me-1"></span>
        {{ cargando ? 'Guardando...' : (editando ? 'Actualizar Rol' : 'Crear Rol') }}
      </button>
    </div>
  </form>
</div>
