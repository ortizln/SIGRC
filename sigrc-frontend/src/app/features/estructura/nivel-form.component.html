<div class="container-fluid px-0 animate-fade-in" style="max-width:1000px;">
  <div class="page-header">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <h2>{{ editando ? 'Editar Nivel' : 'Nuevo Nivel' }}</h2>
        <p>Niveles organizacionales de la estructura institucional</p>
      </div>
      <a routerLink="/talento-humano/estructura" class="btn btn-outline-secondary btn-sm">
        <i class="pi pi-arrow-left" style="font-size:0.7rem;"></i> Volver
      </a>
    </div>
  </div>

  <form autocomplete="off" (ngSubmit)="guardar()" #nivelForm="ngForm">

    <!-- Datos del nivel -->
    <div class="form-section">
      <div class="form-section-header">
        <i class="pi pi-th-large" style="color:var(--primary);"></i>
        <div>
          <strong>Datos del Nivel</strong>
          <small>Identificación y orden del nivel organizacional</small>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Código <span class="text-danger">*</span></label>
          <input autocomplete="off" #codModel="ngModel" [(ngModel)]="form.codigo" name="codigo" required class="form-control" [class.is-invalid]="codModel.invalid && codModel.touched" placeholder="Código (N-001)">
          <div class="validation-feedback" *ngIf="codModel.invalid && codModel.touched">El código es obligatorio</div>
        </div>
        <div class="col-md-8">
          <label class="form-label">Nombre <span class="text-danger">*</span></label>
          <input autocomplete="off" #nomModel="ngModel" [(ngModel)]="form.nombre" name="nombre" required class="form-control" [class.is-invalid]="nomModel.invalid && nomModel.touched" placeholder="Nombre del nivel">
          <div class="validation-feedback" *ngIf="nomModel.invalid && nomModel.touched">El nombre es obligatorio</div>
        </div>
        <div class="col-md-3">
          <label class="form-label">Orden</label>
          <input autocomplete="off" [(ngModel)]="form.orden" name="orden" type="number" min="0" class="form-control" placeholder="Orden">
        </div>
        <div class="col-md-9">
          <label class="form-label">Descripción</label>
          <input autocomplete="off" [(ngModel)]="form.descripcion" name="descripcion" class="form-control" placeholder="Descripción (opcional)">
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
      <a routerLink="/talento-humano/estructura" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary px-4" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm me-1"></span>
        {{ cargando ? 'Guardando...' : (editando ? 'Actualizar Nivel' : 'Crear Nivel') }}
      </button>
    </div>
  </form>
</div>
